# Publica o app no GitHub Pages a cada push na branch main.
# Em Settings → Pages, escolha "GitHub Actions" como fonte.
# As chaves do Supabase vêm do arquivo .env.local (chave publicável, pode ficar no repositório).
# Opcional: crie a variável NEXT_PUBLIC_GOOGLE_CLIENT_ID em Settings → Secrets and variables → Actions → Variables.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Client ID do Google (opcional)
        if: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID != '' }}
        run: echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # O site fica em https://usuario.github.io/nome-do-repositorio/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
